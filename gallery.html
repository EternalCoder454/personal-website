<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery &middot; EternalHell</title>
<meta name="description" content="Pixel art and builds by EternalHell.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141218">

<meta property="og:title" content="Gallery &middot; EternalHell">
<meta property="og:description" content="Pixel art and builds by EternalHell.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/pfp.png">
<meta name="twitter:card" content="summary">

<link rel="icon" href="assets/pfp.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top-app-bar top-app-bar--static" id="app-bar">
  <span class="top-app-bar__title">EternalHell</span>
  <nav class="nav" aria-label="Primary">
    <a class="nav__link" href="index.html">Home</a>
    <a class="nav__link nav__link--active" href="gallery.html" aria-current="page">Gallery</a>
  </nav>
</header>

<main class="content content--wide">

  <section class="card card--flush gallery-section" aria-labelledby="pixel-label">
    <h2 class="card__header" id="pixel-label">Pixel Art</h2>

    <div class="gallery">

      <!-- Drop the image in assets/gallery/pixel-art/ and copy this block.
           The empty state hides itself once a piece exists.

        <figure class="piece">
          <button class="piece__button" type="button">
            <img src="assets/gallery/pixel-art/my-sprite.png" alt="Short description" loading="lazy">
          </button>
          <figcaption class="piece__caption">My sprite</figcaption>
        </figure>
      -->

    </div>

    <div class="empty">
      <span class="material-symbols-rounded empty__icon" aria-hidden="true">grid_view</span>
      <p class="empty__title">Nothing here yet</p>
      <p class="empty__text">Pixel art will show up here.</p>
    </div>
  </section>

  <section class="card card--flush gallery-section" aria-labelledby="builds-label">
    <h2 class="card__header" id="builds-label">Builds</h2>

    <div class="gallery">

      <!-- Same, but the image goes in assets/gallery/builds/.

        <figure class="piece">
          <button class="piece__button" type="button">
            <img src="assets/gallery/builds/my-build.png" alt="Short description" loading="lazy">
          </button>
          <figcaption class="piece__caption">My build</figcaption>
        </figure>
      -->

    </div>

    <div class="empty">
      <span class="material-symbols-rounded empty__icon" aria-hidden="true">architecture</span>
      <p class="empty__title">Nothing here yet</p>
      <p class="empty__text">Interiors and exteriors will show up here.</p>
    </div>
  </section>

  <footer class="footer">EternalHell &middot; <span id="year">2026</span></footer>

</main>

<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox__scrim" data-close></div>
  <button class="lightbox__close icon-button" type="button" id="lightbox-close" aria-label="Close image">
    <span class="material-symbols-rounded" aria-hidden="true">close</span>
  </button>
  <figure class="lightbox__figure">
    <img class="lightbox__img" id="lightbox-img" alt="">
    <figcaption class="lightbox__caption" id="lightbox-caption"></figcaption>
  </figure>
</div>

<script src="script.js"></script>
</body>
</html>
